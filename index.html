<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Robert Källgren | Frontend Developer</title>
        <link rel="stylesheet" href="main.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="grid-overlay" id="gridOverlay"></div>
        <canvas id="particles"></canvas>
        <main class="container">
            <img
                src="img/headshot.png"
                alt="Robert Källgren"
                class="profile-image"
            />
            <div class="intro">
                <h1 class="name">
                    Robert Källgren
                    <span class="spec">5rem / 500</span>
                </h1>
                <p class="tagline">
                    <span class="role" id="role">Frontend Developer</span>
                    based in Uppsala, Sweden
                    <span class="spec">1.5rem / 300</span>
                </p>
            </div>
            <nav class="social-links">
                <a
                    href="https://linkedin.com/in/robertkallgren"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link"
                    aria-label="LinkedIn"
                >
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"
                        />
                    </svg>
                </a>
                <a
                    href="https://github.com/kallgren"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link"
                    aria-label="GitHub"
                >
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"
                        />
                    </svg>
                </a>
            </nav>
        </main>
        <script>
            // Mobile detection
            const isMobile =
                /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
                    navigator.userAgent,
                ) || window.innerWidth <= 768;

            // Feature toggles (disabled on mobile)
            const BLUEPRINT_ENABLED = !isMobile && true;
            const FRONTEND_DEVELOPER_HOVER_ENABLED = !isMobile && false;
            const MOVABLE_ELEMENTS_ENABLED = !isMobile && true;
            const PARTICLES_ENABLED = !isMobile && true;

            const intro = document.querySelector(".intro");
            const role = document.getElementById("role");
            const normal = "Frontend Developer";
            const code = "<FrontendDeveloper />";
            const gridOverlay = document.getElementById("gridOverlay");

            // Hide grid overlay if blueprint is disabled
            if (!BLUEPRINT_ENABLED) {
                gridOverlay.style.display = "none";
            }

            // FrontendDeveloper hover effect (disabled by default)
            if (FRONTEND_DEVELOPER_HOVER_ENABLED) {
                intro.addEventListener("mouseenter", () => {
                    role.textContent = code;
                    role.classList.add("code");
                });

                intro.addEventListener("mouseleave", () => {
                    role.textContent = normal;
                    role.classList.remove("code");
                });
            }

            // Blueprint elements
            const nameEl = document.querySelector(".name");
            const taglineEl = document.querySelector(".tagline");
            const profileEl = document.querySelector(".profile-image");

            function getElementCenter(el) {
                const rect = el.getBoundingClientRect();
                return {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2,
                };
            }

            function updateElementPositions() {
                if (!BLUEPRINT_ENABLED) return;

                const nameRect = nameEl.getBoundingClientRect();
                const taglineRect = taglineEl.getBoundingClientRect();
                const profileRect = profileEl.getBoundingClientRect();

                // Name position and size (circle based on width)
                gridOverlay.style.setProperty(
                    "--name-x",
                    nameRect.left + nameRect.width / 2 + "px",
                );
                gridOverlay.style.setProperty(
                    "--name-y",
                    nameRect.top + nameRect.height / 2 + "px",
                );
                gridOverlay.style.setProperty(
                    "--name-size",
                    nameRect.width * 0.8 + "px",
                );

                // Tagline position and size (circle based on width)
                gridOverlay.style.setProperty(
                    "--tagline-x",
                    taglineRect.left + taglineRect.width / 2 + "px",
                );
                gridOverlay.style.setProperty(
                    "--tagline-y",
                    taglineRect.top + taglineRect.height / 2 + "px",
                );
                gridOverlay.style.setProperty(
                    "--tagline-size",
                    taglineRect.width * 0.7 + "px",
                );

                // Profile position and size (circle)
                gridOverlay.style.setProperty(
                    "--profile-x",
                    profileRect.left + profileRect.width / 2 + "px",
                );
                gridOverlay.style.setProperty(
                    "--profile-y",
                    profileRect.top + profileRect.height / 2 + "px",
                );
                gridOverlay.style.setProperty(
                    "--profile-size",
                    profileRect.width * 1.2 + "px",
                );
            }

            // Update positions on load and resize
            updateElementPositions();
            window.addEventListener("resize", updateElementPositions);

            // Blueprint effect (per-element spotlight reveal)
            if (BLUEPRINT_ENABLED) {
                // Max distance outside element at which opacity reaches 0
                const maxDistance = 300;
                // Padding inside element edge where opacity stays at 1
                const padding = 50;

                // Calculate distance from mouse to element edge (0 if inside)
                function getEdgeDistance(mouseX, mouseY, rect) {
                    const dx = Math.max(
                        0,
                        Math.abs(mouseX - (rect.left + rect.width / 2)) -
                            rect.width / 2 -
                            padding,
                    );
                    const dy = Math.max(
                        0,
                        Math.abs(mouseY - (rect.top + rect.height / 2)) -
                            rect.height / 2 -
                            padding,
                    );
                    return Math.sqrt(dx * dx + dy * dy);
                }

                // For circle elements (profile), use distance to center minus radius
                function getCircleEdgeDistance(mouseX, mouseY, rect) {
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    const radius = rect.width / 2 + padding;
                    const dist = Math.sqrt(
                        (mouseX - centerX) ** 2 + (mouseY - centerY) ** 2,
                    );
                    return Math.max(0, dist - radius);
                }

                document.addEventListener("mousemove", (e) => {
                    const mouseX = e.clientX;
                    const mouseY = e.clientY;

                    const nameRect = nameEl.getBoundingClientRect();
                    const taglineRect = taglineEl.getBoundingClientRect();
                    const profileRect = profileEl.getBoundingClientRect();

                    // Calculate distances to element edges
                    const nameDist = getEdgeDistance(mouseX, mouseY, nameRect);
                    const taglineDist = getEdgeDistance(
                        mouseX,
                        mouseY,
                        taglineRect,
                    );
                    const profileDist = getCircleEdgeDistance(
                        mouseX,
                        mouseY,
                        profileRect,
                    );

                    // Convert distance to opacity (1 when inside/close, 0 when far)
                    const nameOpacity = Math.max(0, 1 - nameDist / maxDistance);
                    const taglineOpacity = Math.max(
                        0,
                        1 - taglineDist / maxDistance,
                    );
                    const profileOpacity = Math.max(
                        0,
                        1 - profileDist / maxDistance,
                    );

                    gridOverlay.style.setProperty(
                        "--name-opacity",
                        nameOpacity,
                    );
                    gridOverlay.style.setProperty(
                        "--tagline-opacity",
                        taglineOpacity,
                    );
                    gridOverlay.style.setProperty(
                        "--profile-opacity",
                        profileOpacity,
                    );

                    // Cursor spotlight (amplifier) - only visible within element masks
                    const maxOpacity = Math.max(
                        nameOpacity,
                        taglineOpacity,
                        profileOpacity,
                    );
                    gridOverlay.style.setProperty("--cursor-x", mouseX + "px");
                    gridOverlay.style.setProperty("--cursor-y", mouseY + "px");
                    gridOverlay.style.setProperty(
                        "--cursor-opacity",
                        maxOpacity,
                    );

                    // Overall blueprint opacity for borders/tags
                    document.body.style.setProperty(
                        "--blueprint-opacity",
                        maxOpacity,
                    );
                });
            }

            // Draggable elements
            if (MOVABLE_ELEMENTS_ENABLED) {
                document.body.classList.add("movable-elements");
            }

            if (MOVABLE_ELEMENTS_ENABLED) {
                const draggableElements = [
                    document.querySelector(".profile-image"),
                    document.querySelector(".name"),
                    document.querySelector(".tagline"),
                ];

                let draggedElement = null;
                let dragOffsetX = 0;
                let dragOffsetY = 0;

                draggableElements.forEach((el) => {
                    el.style.cursor = "grab";

                    el.addEventListener("mousedown", (e) => {
                        e.preventDefault();
                        draggedElement = el;
                        draggedElement.style.cursor = "grabbing";

                        const rect = el.getBoundingClientRect();

                        // If not already positioned as fixed, set it up
                        if (el.style.position !== "fixed") {
                            // Account for the scale on hover (read from CSS variable)
                            const scale =
                                parseFloat(
                                    getComputedStyle(el).getPropertyValue(
                                        "--hover-scale",
                                    ),
                                ) || 1;
                            const unscaledWidth = rect.width / scale;
                            const unscaledHeight = rect.height / scale;
                            // Since transform-origin is bottom-right, the expansion goes left and up
                            const offsetX = rect.width - unscaledWidth;
                            const offsetY = rect.height - unscaledHeight;

                            el.style.position = "fixed";
                            el.style.left = rect.left + offsetX + "px";
                            el.style.top = rect.top + offsetY + "px";
                            el.style.margin = "0";
                            el.style.zIndex = "100";
                        }

                        dragOffsetX = e.clientX - parseFloat(el.style.left);
                        dragOffsetY = e.clientY - parseFloat(el.style.top);
                    });
                });

                document.addEventListener("mousemove", (e) => {
                    if (draggedElement) {
                        const newLeft = e.clientX - dragOffsetX;
                        const newTop = e.clientY - dragOffsetY;
                        draggedElement.style.left = newLeft + "px";
                        draggedElement.style.top = newTop + "px";

                        // Update mask positions while dragging
                        updateElementPositions();
                    }
                });

                document.addEventListener("mouseup", () => {
                    if (draggedElement) {
                        draggedElement.style.cursor = "grab";
                        draggedElement = null;
                    }
                });
            }

            // Particle effect
            if (PARTICLES_ENABLED) {
                const canvas = document.getElementById("particles");
                const ctx = canvas.getContext("2d");
                let particles = [];
                let mouseX = 0;
                let mouseY = 0;
                let particlesEnabled = true;

                function resizeCanvas() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }
                resizeCanvas();
                window.addEventListener("resize", resizeCanvas);

                // Disable particles over social links and main elements (only if movable)
                const socialLinks = document.querySelector(".social-links");
                const particleDisableElements = MOVABLE_ELEMENTS_ENABLED
                    ? [socialLinks, nameEl, taglineEl, profileEl]
                    : [socialLinks];

                particleDisableElements.forEach((el) => {
                    el.addEventListener("mouseenter", () => {
                        particlesEnabled = false;
                    });
                    el.addEventListener("mouseleave", () => {
                        particlesEnabled = true;
                    });
                });

                document.addEventListener("mousemove", (e) => {
                    mouseX = e.clientX;
                    mouseY = e.clientY;

                    if (!particlesEnabled) return;

                    // Spawn particles
                    for (let i = 0; i < 2; i++) {
                        particles.push({
                            x: mouseX,
                            y: mouseY,
                            vx: (Math.random() - 0.5) * 2,
                            vy: (Math.random() - 0.5) * 2,
                            life: 1,
                            size: Math.random() * 3 + 1,
                            color: Math.random() > 0.5 ? "#3b82f6" : "#e07850",
                        });
                    }
                });

                function animateParticles() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    particles = particles.filter((p) => {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.life -= 0.02;
                        p.size *= 0.98;

                        if (p.life > 0) {
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                            ctx.fillStyle = p.color;
                            ctx.globalAlpha = p.life * 0.6;
                            ctx.fill();
                            ctx.globalAlpha = 1;
                            return true;
                        }
                        return false;
                    });

                    requestAnimationFrame(animateParticles);
                }
                animateParticles();
            }
        </script>
    </body>
</html>
